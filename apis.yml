aid: agotoztechnology
name: AgotoZ Technology
description: >-
  AgotoZ Technology (观脉科技 / Agotoz Technology (Beijing) Co., Ltd.) is a Beijing-headquartered
  network-as-a-service provider, registered in 2016 and in commercial operation since 2017, that
  builds and operates ALLWAN — a self-built global SD-WAN overlay network the company says reaches
  more than 70 countries and regions — alongside the Linker and Linker Pro CPE intelligent access
  gateways, a global integrated CDN, cloud connection and one-stop public cloud services, SASE
  dynamic secure access, DDoS protection, worldwide data centre and co-location resources, and the
  Lingyin LinkTo real-time transmission service. Its stack applies layer 2 through layer 7 SD-WAN
  technology — VxLAN, millisecond-scale global dynamic routing, single- and bilateral TCP/UDP
  acceleration, efficient data compression and high-performance caching — to low-latency enterprise
  interconnect and application acceleration for gaming, VR/AR/MR, online education, audio and video
  conferencing, and internet companies. AgotoZ states it holds full MIIT telecommunications licences
  (A24-1, B11, B12, B13, B14), is a Chinese National High-tech Enterprise, and has served more than
  200 global internet companies; it has raised roughly $57M from Legend Capital, SIG China, CICC
  Capital and NGP Capital, and runs offices in Beijing, Shanghai, Singapore and Hong Kong. The
  company sells through a trial-request and sales motion and publishes no developer portal, API
  reference, SDK or machine-readable contract of any kind, though it does operate a
  credential-gated API host of its own at openapi.agotoz.com.
