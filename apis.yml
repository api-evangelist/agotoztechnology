apis:
- aid: agotoztechnology:agotoz-openapi
  name: AgotoZ OpenAPI Host (gated)
  description: >-
    A first-party API host AgotoZ operates on its own registrable domain at openapi.agotoz.com,
    named for an open API surface and serving a valid wildcard *.agotoz.com TLS certificate. It is
    not reachable anonymously: over port 80 an nginx/1.14.0 instance answers EVERY path — the root,
    /openapi.json, /swagger.json, /v2/api-docs, /graphql, /mcp and every /.well-known/* path alike,
    including a nonsense control path — with an identical 571-byte HTTP 403 Forbidden page, and over
    port 443 the TLS handshake completes (TLSv1.2, ALPN h2 accepted) but no HTTP response is returned
    to an anonymous caller within 25 seconds. AgotoZ publishes no reference, no specification and no
    authentication documentation for this host anywhere on its public site, so no operations,
    parameters, authentication scheme or rate limits are recorded here. Listed as a measured, gated
    surface — its existence is evidence; its contract is not public.
  humanURL: https://www.agotoz.com/views/product/allwan
  baseURL: https://openapi.agotoz.com
  image: https://static.agotoz.com/images/01home/black-logo.svg
  tags:
  - SD-WAN
  - Network as a Service
  - Enterprise Networking
  properties: []
  x-access: gated
  x-evidence:
    discovered: '2026-09-12'
    method: probed
    source: DNS resolution of openapi.agotoz.com plus anonymous HTTP/HTTPS probes, 2026-09-12
    probes:
    - url: http://openapi.agotoz.com/
      status: 403
    - url: http://openapi.agotoz.com/openapi.json
      status: 403
    - url: http://openapi.agotoz.com/swagger.json
      status: 403
    - url: http://openapi.agotoz.com/v2/api-docs
      status: 403
    - url: http://openapi.agotoz.com/graphql
      status: 403
    - url: http://openapi.agotoz.com/mcp
      status: 403
    - url: http://openapi.agotoz.com/.well-known/zzz-control-probe-9182
      status: 403
      note: control probe — identical body hash to every real path, so the 403 is blanket
    - url: https://openapi.agotoz.com/
      status: 0
      note: TLS handshake succeeds with CN=*.agotoz.com; no HTTP response within 25s
